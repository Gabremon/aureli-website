version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aureli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aureli_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aureli_password}
      POSTGRES_DB: ${DB_NAME:-aureli_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Persist data between container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aureli_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

